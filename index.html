<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Rifas - Vibras Positivas</title>
    <style>
        :root { --verde: #5d7a4d; --rojo: #c0392b; --gris: #f4f7f1; }
        body { font-family: sans-serif; background: var(--gris); text-align: center; padding: 10px; }
        
        .card { background: white; max-width: 500px; margin: auto; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--verde); color: white; padding: 15px; }
        
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 15px; }
        .num { aspect-ratio: 1; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; cursor: pointer; border-radius: 4px; border: 1px solid #ddd; }
        .num.vendido { background: var(--rojo); color: white; }

        /* Ventanita Flotante */
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.3); z-index: 100; width: 80%; max-width: 300px; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; }
        
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: var(--verde); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn-cancelar { background: #999; margin-left: 5px; }
        
        .footer { margin-top: 20px; font-size: 0.8rem; color: #666; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2 id="titulo">Control de Rifa</h2>
            <p id="info">Toca un número para registrar al comprador</p>
        </div>

        <div class="grid" id="cuadricula"></div>
    </div>

    <div id="overlay"></div>
    <div id="modal">
        <h3 id="modal-titulo">Número 00</h3>
        <input type="text" id="nombre-cliente" placeholder="Nombre del cliente">
        <input type="text" id="tel-cliente" placeholder="Teléfono">
        <div id="info-existente" style="margin-bottom: 10px; color: var(--rojo); font-weight: bold;"></div>
        <button onclick="guardarVenta()">Guardar</button>
        <button class="btn-cancelar" onclick="cerrarModal()">Cerrar</button>
    </div>

    <div class="footer">
        App desarrollada por Vibras Positivas Derechos de Autor (3117700431)
    </div>

    <script>
        let datosRifa = JSON.parse(localStorage.getItem('base_rifa_vibras')) || {};
        let numeroActual = null;

        const grid = document.getElementById('cuadricula');
        const modal = document.getElementById('modal');
        const overlay = document.getElementById('overlay');

        function dibujar() {
            grid.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                let n = i.toString().padStart(2, '0');
                let div = document.createElement('div');
                div.className = 'num' + (datosRifa[n] ? ' vendido' : '');
                div.innerText = n;
                div.onclick = () => abrirModal(n);
                grid.appendChild(div);
            }
        }

        function abrirModal(n) {
            numeroActual = n;
            document.getElementById('modal-titulo').innerText = "Número " + n;
            
            if (datosRifa[n]) {
                document.getElementById('info-existente').innerText = "Vendido a: " + datosRifa[n].nombre;
                document.getElementById('nombre-cliente').value = datosRifa[n].nombre;
                document.getElementById('tel-cliente').value = datosRifa[n].tel;
            } else {
                document.getElementById('info-existente').innerText = "";
                document.getElementById('nombre-cliente').value = "";
                document.getElementById('tel-cliente').value = "";
            }
            
            modal.style.display = 'block';
            overlay.style.display = 'block';
        }

        function cerrarModal() {
            modal.style.display = 'none';
            overlay.style.display = 'none';
        }

        function guardarVenta() {
            const nombre = document.getElementById('nombre-cliente').value;
            const tel = document.getElementById('tel-cliente').value;

            if (nombre.trim() === "") {
                // Si el nombre está vacío, borramos el registro (lo liberamos)
                delete datosRifa[numeroActual];
            } else {
                datosRifa[numeroActual] = { nombre: nombre, tel: tel };
            }

            localStorage.setItem('base_rifa_vibras', JSON.stringify(datosRifa));
            dibujar();
            cerrarModal();
        }

        dibujar();
    </script>
</body>
</html>
