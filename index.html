<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Rifas | Vibras Positivas</title>
    <style>
        :root { --verde: #5d7a4d; --rojo: #c0392b; --gris-f: #f4f7f1; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris-f); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .admin-config { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-bottom: 20px; }
        .admin-config input { width: calc(100% - 24px); padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; }

        .backup-section { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .btn-backup { background: #2c3e50; color: white; font-size: 0.8rem; padding: 8px; border: none; border-radius: 5px; cursor: pointer; flex: 1; }
        .btn-import { background: #8e44ad; color: white; font-size: 0.8rem; padding: 8px; border: none; border-radius: 5px; cursor: pointer; flex: 1; }

        .card { background: white; width: 100%; max-width: 500px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--verde); color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; }

        .info-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: #fafafa; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .info-bar div { border-left: 3px solid var(--verde); padding-left: 8px; }
        .full-row { grid-column: span 2; }
        .price-tag { background: #e9f0e4; grid-column: span 2; padding: 10px; text-align: center; border-radius: 8px; font-weight: bold; color: var(--verde); font-size: 1.1rem; }

        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; padding: 15px; }
        .num { aspect-ratio: 1; background: #fff; border: 1px solid #ddd; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .num.vendido { background: var(--rojo); color: white; border-color: var(--rojo); }

        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; box-shadow: 0 0 30px rgba(0,0,0,0.3); z-index: 100; width: 85%; max-width: 320px; text-align: center; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 90; }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-save { background: var(--verde); color: white; }
        .btn-close { background: #eee; color: #666; }

        .footer { margin-top: 30px; text-align: center; font-size: 0.8rem; color: #777; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-config">
        <strong style="color: var(--verde);">⚙️ Configurar Datos:</strong>
        <input type="text" id="cfg-titulo" placeholder="Nombre de la Rifa" oninput="actualizarUI()">
        <input type="text" id="cfg-premio" placeholder="Premio" oninput="actualizarUI()">
        <input type="text" id="cfg-precio" placeholder="Precio (Ej: $15.000)" oninput="actualizarUI()">
        <input type="text" id="cfg-lote" placeholder="Lotería (Ej: Medellín)" oninput="actualizarUI()">
        <input type="text" id="cfg-fecha" placeholder="Fecha del Sorteo" oninput="actualizarUI()">
        <input type="text" id="cfg-contacto" placeholder="Pagos / Contacto" oninput="actualizarUI()">
        
        <div class="backup-section">
            <button class="btn-backup" onclick="exportarDatos()">📥 Descargar Backup</button>
            <button class="btn-import" onclick="document.getElementById('fileInput').click()">📤 Subir Backup</button>
            <input type="file" id="fileInput" style="display:none" onchange="importarDatos(event)">
        </div>
    </div>

    <div class="card">
        <div class="header">
            <h1 id="out-titulo">Control de Rifa</h1>
        </div>
        <div class="info-bar">
            <div class="price-tag">Valor del número: <span id="out-precio">$0</span></div>
            <div><strong>🎁 Premio:</strong> <br><span id="out-premio">---</span></div>
            <div><strong>📅 Sorteo:</strong> <br><span id="out-fecha">---</span></div>
            <div class="full-row"><strong>🎰 Lotería:</strong> <span id="out-lote">---</span></div>
            <div class="full-row"><strong>👤 Contacto:</strong> <span id="out-contacto">---</span></div>
        </div>
        <div class="grid" id="gridConten"></div>
    </div>

    <div id="overlay" onclick="cerrarModal()"></div>
    <div id="modal">
        <h2 id="modal-num" style="color: var(--verde);">Número 00</h2>
        <p id="label-status" style="font-size: 0.9rem; margin-bottom: 10px;"></p>
        <input type="text" id="c-nombre" style="width: 90%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;" placeholder="Nombre del Comprador">
        <div class="modal-btns">
            <button class="btn-save" onclick="guardar()">Guardar</button>
            <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

    <div class="footer">
        App desarrollada por Vibras Positivas Derechos de Autor (3117700431)
    </div>

    <script>
        let rifaBD = JSON.parse(localStorage.getItem('bd_rifa_vibras')) || {};
        let configBD = JSON.parse(localStorage.getItem('cfg_rifa_vibras')) || { t:'', p:'', f:'', c:'', pr:'', lt:'' };
        let numSel = null;

        function iniciar() {
            document.getElementById('cfg-titulo').value = configBD.t || "";
            document.getElementById('cfg-premio').value = configBD.p || "";
            document.getElementById('cfg-fecha').value = configBD.f || "";
            document.getElementById('cfg-contacto').value = configBD.c || "";
            document.getElementById('cfg-precio').value = configBD.pr || "";
            document.getElementById('cfg-lote').value = configBD.lt || "";
            actualizarUI();
            dibujarGrid();
        }

        function actualizarUI() {
            configBD = {
                t: document.getElementById('cfg-titulo').value,
                p: document.getElementById('cfg-premio').value,
                f: document.getElementById('cfg-fecha').value,
                c: document.getElementById('cfg-contacto').value,
                pr: document.getElementById('cfg-precio').value,
                lt: document.getElementById('cfg-lote').value
            };
            localStorage.setItem('cfg_rifa_vibras', JSON.stringify(configBD));
            document.getElementById('out-titulo').innerText = configBD.t || "CONTROL DE RIFA";
            document.getElementById('out-premio').innerText = configBD.p || "---";
            document.getElementById('out-fecha').innerText = configBD.f || "---";
            document.getElementById('out-contacto').innerText = configBD.c || "---";
            document.getElementById('out-precio').innerText = configBD.pr || "$0";
            document.getElementById('out-lote').innerText = configBD.lt || "---";
        }

        function dibujarGrid() {
            const container = document.getElementById('gridConten');
            container.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                let n = i.toString().padStart(2, '0');
                let div = document.createElement('div');
                div.className = 'num' + (rifaBD[n] ? ' vendido' : '');
                div.innerText = n;
                div.onclick = () => abrirModal(n);
                container.appendChild(div);
            }
        }

        function abrirModal(n) {
            numSel = n;
            document.getElementById('modal-num').innerText = "Número " + n;
            const label = document.getElementById('label-status');
            const inputNom = document.getElementById('c-nombre');
            if (rifaBD[n]) {
                label.innerText = "Estado: VENDIDO";
                label.style.color = "var(--rojo)";
                inputNom.value = rifaBD[n].nombre;
            } else {
                label.innerText = "Estado: DISPONIBLE";
                label.style.color = "gray";
                inputNom.value = "";
            }
            document.getElementById('modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function guardar() {
            const nom = document.getElementById('c-nombre').value;
            if (nom.trim() === "") { delete rifaBD[numSel]; } 
            else { rifaBD[numSel] = { nombre: nom }; }
            localStorage.setItem('bd_rifa_vibras', JSON.stringify(rifaBD));
            dibujarGrid();
            cerrarModal();
        }

        // --- FUNCIONES DE BACKUP ---
        function exportarDatos() {
            const data = { rifa: rifaBD, config: configBD };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_rifa_${configBD.t || 'vibras'}.json`;
            a.click();
        }

        function importarDatos(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = JSON.parse(e.target.result);
                if (data.rifa && data.config) {
                    rifaBD = data.rifa;
                    configBD = data.config;
                    localStorage.setItem('bd_rifa_vibras', JSON.stringify(rifaBD));
                    localStorage.setItem('cfg_rifa_vibras', JSON.stringify(configBD));
                    iniciar();
                    alert("¡Backup restaurado con éxito!");
                }
            };
            reader.readAsText(file);
        }

        iniciar();
    </script>
</body>
</html>
